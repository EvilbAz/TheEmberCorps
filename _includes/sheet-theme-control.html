<label class="sheet-theme-control">
  <span class="palette-swatch" aria-hidden="true"></span>
  <select id="sheet-theme" aria-label="Website theme">
    <optgroup label="Ember Corps originals">
      <option value="dark" selected>Dark</option>
      <option value="light">Light</option>
      <option value="primal-dark">Primal · dark</option>
      <option value="primal-light">Primal · light</option>
      <option value="abyss-dark">Abyss · dark</option>
      <option value="abyss-light">Abyss · light</option>
    </optgroup>
    <optgroup label="Shotai sheet">
      <option value="sheet-shotai">Shotai</option>
      <option value="sheet-nw">NW</option>
      <option value="sheet-ember">Ember</option>
      <option value="sheet-abyss">Abyss</option>
      <option value="sheet-scroll">Scroll</option>
      <option value="sheet-sakura">Sakura</option>
      <option value="sheet-iron">Iron</option>
    </optgroup>
  </select>
</label>
