name: Apply timeline ambient archive

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_timeline_ambient.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_timeline_ambient.py
      - run: |
          git config user.name "Ember Corps Rules Bot"
          git config user.email "actions@users.noreply.github.com"
          git add timeline.md
          git diff --cached --quiet && exit 0
          git commit -m "Add animated era backdrop to timeline"
          git push
