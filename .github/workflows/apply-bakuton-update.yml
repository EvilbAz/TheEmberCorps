name: Apply Bakuton update

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-bakuton:
    if: github.repository == 'EvilbAz/TheEmberCorps'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Bakuton rules update
        shell: python
        run: |
          from pathlib import Path

          path = Path('rules/clans.md')
          text = path.read_text(encoding='utf-8')

          feature = "* When Sudden Attack modifies a Bakuton Taijutsu, increase that technique's Chakra cost by 3 per stack of Sudden Attack applied."
          starting = "* Bakuton users begin with Elemental Aptitude for Doton and Raiton and gain Elemental Affinity: Bakuton. Bakuton does not include Doton or Raiton in its Affinity and ordinary Doton or Raiton techniques cannot be converted into Bakuton unless a feature explicitly allows it. Damaging Bakuton techniques inflict Energy Wounds unless stated otherwise."

          # Keep exactly one Sudden Attack rule beneath the Bakuton starting feature.
          while f"{feature}\n{feature}" in text:
              text = text.replace(f"{feature}\n{feature}", feature, 1)
          if feature not in text:
              if starting not in text:
                  raise SystemExit('Bakuton starting feature not found')
              text = text.replace(starting, f"{starting}\n{feature}", 1)

          replacements = [
              ('**Damage:** 10d6\\!\\>5', '**Damage:** 8d6\\!o\\>5'),
              ('**Damage:** 14d12\\!\\>8', '**Damage:** 12d10\\!o\\>8'),
              ('**Damage:** 25d10\\!\\>5', '**Damage:** 18d10\\!o\\>8'),
          ]

          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'Expected one match for {old!r}')
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Could not find expected old or new text for {old!r}')

          path.write_text(text, encoding='utf-8')

      - name: Commit update
        run: |
          if git diff --quiet -- rules/clans.md; then
            echo "Bakuton rules already updated."
            exit 0
          fi
          git config user.name "Ember Corps Rules Bot"
          git config user.email "actions@users.noreply.github.com"
          git add rules/clans.md
          git commit -m "Normalize Bakuton jutsu balance update"
          git push origin HEAD:main
