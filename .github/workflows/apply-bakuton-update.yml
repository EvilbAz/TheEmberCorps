name: Apply Bakuton update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bakuton-update.yml'

permissions:
  contents: write

jobs:
  update-bakuton:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Bakuton rules update
        shell: python
        run: |
          from pathlib import Path

          path = Path('rules/clans.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '* Bakuton users begin with Elemental Aptitude for Doton and Raiton and gain Elemental Affinity: Bakuton. Bakuton does not include Doton or Raiton in its Affinity and ordinary Doton or Raiton techniques cannot be converted into Bakuton unless a feature explicitly allows it. Damaging Bakuton techniques inflict Energy Wounds unless stated otherwise.\n',
                  '* Bakuton users begin with Elemental Aptitude for Doton and Raiton and gain Elemental Affinity: Bakuton. Bakuton does not include Doton or Raiton in its Affinity and ordinary Doton or Raiton techniques cannot be converted into Bakuton unless a feature explicitly allows it. Damaging Bakuton techniques inflict Energy Wounds unless stated otherwise.\n* When Sudden Attack modifies a Bakuton Taijutsu, increase that technique\'s Chakra cost by 3 per stack of Sudden Attack applied.\n'
              ),
              ('**Damage:** 10d6\\!\\>5', '**Damage:** 8d6\\!o\\>5'),
              ('**Damage:** 14d12\\!\\>8', '**Damage:** 12d10\\!o\\>8'),
              ('**Damage:** 25d10\\!\\>5', '**Damage:** 18d10\\!o\\>8'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit update
        run: |
          git config user.name "Ember Corps Rules Bot"
          git config user.email "actions@users.noreply.github.com"
          git add rules/clans.md
          git commit -m "Update Bakuton jutsu balance"
          git push origin HEAD:main
