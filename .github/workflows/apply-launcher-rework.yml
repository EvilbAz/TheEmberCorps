name: Apply launcher rework

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_launcher_rework.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_launcher_rework.py
      - run: |
          git config user.name "Ember Corps Rules Bot"
          git config user.email "actions@users.noreply.github.com"
          git add rules/equipment.md
          git diff --cached --quiet && exit 0
          git commit -m "Rework launcher identity and Volley rules"
          git push
