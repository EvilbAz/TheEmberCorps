name: Apply weekly DT bonus

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_weekly_dt_bonus.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_weekly_dt_bonus.py
      - run: |
          git config user.name "Ember Corps Rules Bot"
          git config user.email "actions@users.noreply.github.com"
          git add rules/core.md
          git diff --cached --quiet && exit 0
          git commit -m "Add weekly Spar and Roleplay downtime bonus"
          git push
