name: Apply Jugo clarity pass

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_jugo_clarity_pass.py'
      - 'scripts/jugo_clarity_trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_jugo_clarity_pass.py
      - run: |
          git config user.name "Ember Corps Rules Bot"
          git config user.email "actions@users.noreply.github.com"
          git add rules/clans.md
          git diff --cached --quiet && exit 0
          git commit -m "Clarify and normalize Jugo bloodline mechanics"
          git push
